<div class="flex justify-center">
  <div class="container card flex flex-col">
    <div class="flex flex-col">
      <h2 class="h2 mb-3">Choose Coins</h2>
      <div class="flex flex-row items-center">
        <mat-form-field class="flex grow">
          <mat-label>Enter Coin Value</mat-label>
          <input
            matInput
            [formControl]="coinNumber"
            type="number"
            min="1"
            max="9"
            placeholder="1-9" />
        </mat-form-field>
        <button
          mat-raised-button
          color="primary"
          class="mb-5 ml-5"
          (click)="onSubmit()"
          [disabled]="entryCoinsArray.length === 4"
          type="button">
          Add Coin
        </button>
      </div>
    </div>
    <div class="flex" *ngIf="entryCoinsArray.length > 0">
      <div class="flex flex-row gap-8">
        @for (entryCoin of entryCoinsArray; track entryCoin) {
          <div class="flex flex-col items-center">
            <app-coin
              class="flex"
              [entryCoin]="entryCoin.coin.entryCoin"
              [coinValue]="entryCoin.coin.value"></app-coin>
            <button mat-icon-button (click)="removeCoin(entryCoin)">
              <mat-icon>remove_circle</mat-icon>
            </button>
          </div>
        }
      </div>
    </div>
    <div class="flex justify-center mt-5" *ngIf="entryCoinsArray.length === 4">
        <button
          mat-raised-button
          color="accent"
          (click)="startGame()"
          type="button">
          Start Game
        </button>
    </div>
  </div>
</div>
